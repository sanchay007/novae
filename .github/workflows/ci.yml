name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: novae
          POSTGRES_PASSWORD: novae
          POSTGRES_DB: novae
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novae"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm run build -w @novae/shared
      - run: npm test -w @novae/shared
      - run: npm run typecheck -w @novae/shared
      - run: npm run build -w @novae/api
      - run: npm run build -w @novae/worker
      - name: Migrate database
        env:
          DATABASE_URL: postgresql://novae:novae@localhost:5432/novae
        run: npm run migration:run -w @novae/api
