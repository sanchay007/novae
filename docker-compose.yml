services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: novae
      POSTGRES_PASSWORD: novae
      POSTGRES_DB: novae
    ports:
      - "5432:5432"
    volumes:
      - novae_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novae"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - novae_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  novae_pg:
  novae_redis:
